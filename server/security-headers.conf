# IIM Technical Services: server-level rules for Hostinger (LiteSpeed reads .htaccess).
# Paste ABOVE the "# BEGIN WordPress" block in public_html/.htaccess.
# Keep the CSP in sync with iim_core_csp() in plugins/iim-core/includes/hardening.php.

# ---------- 1. Canonical host: apex -> https://www (one hop) ----------
# With Cloudflare in front, use SSL mode "Full (strict)", never "Flexible", or this rule loops.
<IfModule mod_rewrite.c>
RewriteEngine On
RewriteCond %{HTTP_HOST} ^iimtechnicalservices\.com$ [NC,OR]
RewriteCond %{HTTPS} off
RewriteRule ^(.*)$ https://www.iimtechnicalservices.com/$1 [R=301,L]

# Block XML-RPC and direct PHP execution in uploads.
RewriteRule ^xmlrpc\.php$ - [F,L]
RewriteRule ^wp-content/uploads/.*\.php$ - [F,L]
</IfModule>

# ---------- 2. Security headers ----------
<IfModule mod_headers.c>
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
Header always set X-Frame-Options "SAMEORIGIN"

# Phase 1 (staging + first 2 weeks live): report only. Phase 2: rename to Content-Security-Policy.
Header always set Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://www.googletagmanager.com 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://challenges.cloudflare.com https://www.google-analytics.com https://*.google-analytics.com; frame-src https://challenges.cloudflare.com https://www.google.com; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# HSTS: enable only after HTTPS works on www and apex for at least a week. Then consider preload.
# Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

# The form endpoints send "Cache-Control: no-store" from PHP (iim-core/includes/rest.php).
</IfModule>

# ---------- 3. Compression and long cache for static assets ----------
<IfModule mod_deflate.c>
AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml text/plain application/xml
</IfModule>

<IfModule mod_expires.c>
ExpiresActive On
ExpiresByType text/css "access plus 1 year"
ExpiresByType application/javascript "access plus 1 year"
ExpiresByType font/woff2 "access plus 1 year"
ExpiresByType image/webp "access plus 1 year"
ExpiresByType image/avif "access plus 1 year"
ExpiresByType image/jpeg "access plus 1 year"
ExpiresByType image/png "access plus 1 year"
ExpiresByType image/svg+xml "access plus 1 year"
</IfModule>

<FilesMatch "\.(css|js|woff2|webp|avif|jpe?g|png|svg)$">
<IfModule mod_headers.c>
Header set Cache-Control "public, max-age=31536000, immutable"
</IfModule>
</FilesMatch>

# ---------- 4. Protect sensitive files ----------
<FilesMatch "^(wp-config\.php|\.env|readme\.html|license\.txt|composer\.(json|lock)|package(-lock)?\.json)$">
Require all denied
</FilesMatch>
Options -Indexes
